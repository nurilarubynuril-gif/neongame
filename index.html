<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GeoBlast – Neon Dash</title>
  <meta name="description" content="Geometry Dash clone with neon style, double jump, gravity portals and moving obstacles."/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="game-wrapper">

  <!-- Background star canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Main game canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Progress bar -->
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>

  <!-- Mute button -->
  <button id="mute-btn" title="Toggle sound">🔊</button>

  <!-- ── MENU SCREEN ── -->
  <div class="overlay" id="screen-menu">
    <div class="logo-title">GeoBlast</div>
    <div class="logo-sub">Neon Dash — Infinite Runner</div>
    <div class="controls-hint">
      <span>SPACE</span> / <span>↑</span> Jump &nbsp;·&nbsp; Double-tap for Double Jump<br/>
      Reach gravity portals to flip the world
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="btn-play-inf">▶ Infinite Mode</button>
      <button class="btn btn-purple" id="btn-levels">🏆 Levels</button>
    </div>
  </div>

  <!-- ── LEVEL SELECT SCREEN ── -->
  <div class="overlay hidden" id="screen-levels">
    <div class="logo-title" style="font-size:2rem">Select Level</div>
    <div class="level-grid" id="level-grid"></div>
    <button class="btn btn-pink" id="btn-back-menu">← Back</button>
  </div>

  <!-- ── GAME OVER SCREEN ── -->
  <div class="overlay hidden" id="screen-gameover">
    <div class="logo-title" style="font-size:2.2rem;color:var(--neon-pink)">GAME OVER</div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Progress</div>
        <div class="stat-value" id="go-progress">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Score</div>
        <div class="stat-value purple" id="go-score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Best</div>
        <div class="stat-value pink" id="go-best">0%</div>
      </div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="btn-restart">↺ Restart</button>
      <button class="btn btn-pink" id="btn-go-menu">⌂ Menu</button>
    </div>
  </div>

  <!-- ── WIN SCREEN ── -->
  <div class="overlay hidden" id="screen-win">
    <div class="logo-title" style="font-size:2.2rem">LEVEL CLEAR!</div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="win-score">0</div>
      </div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="btn-next-level">Next Level ▶</button>
      <button class="btn btn-pink" id="btn-win-menu">⌂ Menu</button>
    </div>
  </div>

</div>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
